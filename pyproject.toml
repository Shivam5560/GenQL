[project]
name = "genql"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shivam Sourav", email = "shivamsourav2003@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "dependency-injector>=4.49.1",
    "fastapi>=0.141.1",
    "graphdatascience>=1.22",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "neo4j>=6.3.0",
    "numpy>=2.3.5",
    "pgvector>=0.5.0",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.10.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.52",
    "sqlglot>=30.18.0",
    "sse-starlette>=3.4.11",
    "structlog>=26.1.0",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
genql = "genql.cli.main:app"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
data = [
    "duckdb>=1.5.5",
]
dev = [
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "paramiko>=5.0.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
    "testcontainers>=4.15.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Plans and specs are prose. Their fenced Python blocks are illustrative — often
# fragments of a class body or a diff — so formatting them as whole modules is
# noise, and `ruff format --check .` would fail on documentation forever.
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PL"]

[tool.ruff.lint.per-file-ignores]
# Magic values in assertions are the point of an assertion.
"tests/**" = ["PLR2004"]

[tool.ruff.lint.flake8-bugbear]
# `typer.Option(...)` in a default is how Typer declares a CLI option; it is
# evaluated once at import time by design, not per-call, so B008's mutable-
# default warning does not apply.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

# scikit-learn ships no py.typed marker / type stubs.
[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
