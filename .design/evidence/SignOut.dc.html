<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,300;6..72,400&family=Space+Mono:wght@400;700&display=swap">
  <style>
    body { margin: 0; background: #0c0b0a; }
    a { color: #ff7a45; } a:hover { color: #ffa07a; }
    .sans { font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace; font-variant-numeric: tabular-nums; }
    .serif { font-family: 'Newsreader', Georgia, 'Times New Roman', serif; }
    .eb { font-family: 'Space Mono', ui-monospace, monospace; text-transform: uppercase; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 0.7s linear infinite; }
    .btn { cursor: pointer; border: 0; font-family: 'Space Mono', ui-monospace, monospace; text-transform: uppercase; }
  </style>
</helmet>

<div class="sans" style="width: 900px; height: 600px; box-sizing: border-box; background: #0c0b0a; color: #f2efe8; position: relative; overflow: hidden; display: flex;">

  <!-- Sidebar, for context -->
  <div style="width: 264px; flex-shrink: 0; border-right: 1px solid rgba(255,255,255,0.14); background: #0c0b0a; display: flex; flex-direction: column;">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.14);">
      <span class="eb" style="font-size: 14.4px; font-weight: 500; letter-spacing: 0.14em;">Aura<span style="color: #ff7a45;">SQL</span></span>
    </div>
    <div style="flex: 1;"></div>
    <!-- The account row: the trigger -->
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; border-top: 1px solid rgba(255,255,255,0.14); padding: 12px 18px;">
      <span style="font-size: 11.8px; color: #a39b8c; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">shivamsourav2003@gm&hellip;</span>
      <button class="btn" onClick="{{ ask }}" style="flex-shrink: 0; border: 1px solid rgba(255,255,255,0.14); background: transparent; padding: 4px 8px; font-size: 9.9px; letter-spacing: 0.1em; color: #a39b8c;">Sign out</button>
    </div>
  </div>

  <!-- Transcript stub -->
  <div style="flex: 1; padding: 30px 34px; opacity: 0.5;">
    <h2 class="serif" style="margin: 0; font-size: 24px; font-weight: 400; line-height: 1.25; max-width: 30ch;">Top 5 states with number of distinct stores</h2>
    <div style="margin-top: 20px; height: 1px; background: rgba(255,255,255,0.14);"></div>
    <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 9px;">
      <div style="height: 9px; width: 62%; background: #1b1a17;"></div>
      <div style="height: 9px; width: 44%; background: #1b1a17;"></div>
    </div>
  </div>

  <!-- ── The confirmation ─────────────────────────────────────── -->
  <sc-if value="{{ open }}" hint-placeholder-val="{{ true }}">
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div style="width: 100%; max-width: 384px; border: 1px solid rgba(255,255,255,0.14); background: #151412; padding: 28px; box-shadow: 0 40px 90px -40px rgba(0,0,0,0.7);">

      <div class="eb" style="font-size: 10px; letter-spacing: 0.16em; color: #a39b8c;">AuraSQL</div>
      <h2 class="serif" style="margin: 9px 0 0 0; font-size: 30px; font-weight: 300; line-height: 1.05; letter-spacing: -0.02em;">Sign out?</h2>

      <p style="margin: 14px 0 0 0; font-size: 13px; line-height: 1.6; color: #a39b8c;">Your threads, datasources and saved SQL stay exactly where they are. You will need to sign in again to reach them.</p>

      <div style="margin-top: 14px; border-left: 2px solid rgba(255,255,255,0.14); padding: 2px 0 2px 11px;">
        <p style="margin: 0; font-size: 12px; line-height: 1.55; color: #6f685c;">This signs out every AuraSQL tab in this browser &mdash; they share one session.</p>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 24px;">
        <button class="btn" onClick="{{ cancel }}" style="flex: 1; border: 1px solid rgba(255,255,255,0.14); background: transparent; padding: 13px 16px; font-size: 11px; letter-spacing: 0.16em; color: #a39b8c;">Stay signed in</button>
        <sc-if value="{{ busy }}" hint-placeholder-val="{{ false }}">
          <button class="btn" style="flex: 1; background: #ff7a45; padding: 13px 16px; font-size: 11px; letter-spacing: 0.16em; color: #ffffff; opacity: 0.6; display: flex; align-items: center; justify-content: center; gap: 9px; cursor: default;">
            <svg class="spin" width="13" height="13" viewBox="0 0 16 16" fill="none" style="color: #ffffff;"><circle cx="8" cy="8" r="6.2" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.8"/><path d="M8 1.8a6.2 6.2 0 0 1 6.2 6.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            Signing out
          </button>
        </sc-if>
        <sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}">
          <button class="btn" onClick="{{ confirm }}" style="flex: 1; background: #ff7a45; padding: 13px 16px; font-size: 11px; letter-spacing: 0.16em; color: #ffffff;">Sign out</button>
        </sc-if>
      </div>

      <p style="margin: 14px 0 0 0; text-align: center; font-size: 11px; color: #4a453d;">Esc to stay</p>
    </div>
  </div>
  </sc-if>

</div>

</x-dc>
<script data-dc-script data-props='{"$preview":{"width":900,"height":600}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: true, busy: false };
  }
  renderVals() {
    return {
      open: this.state.open,
      busy: this.state.busy,
      idle: !this.state.busy,
      ask: () => this.setState({ open: true, busy: false }),
      cancel: () => this.setState({ open: false, busy: false }),
      confirm: () => {
        this.setState({ busy: true });
        setTimeout(() => this.setState({ open: false, busy: false }), 1600);
      },
    };
  }
}
</script>
</body>
</html>
