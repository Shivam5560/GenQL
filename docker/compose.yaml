services:
  paradedb:
    image: paradedb/paradedb:0.25.6-pg18
    environment:
      POSTGRES_USER: genql
      POSTGRES_PASSWORD: genql
      POSTGRES_DB: genql
    ports: ["5433:5432"]
    healthcheck:
      # -h 127.0.0.1 is required: pg_isready on the unix socket succeeds against initdb's
      # temporary bootstrap server, reporting healthy before the genql database exists.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U genql -d genql"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      # PostgreSQL 18 sets PGDATA=/var/lib/postgresql/18/docker and declares its VOLUME at
      # /var/lib/postgresql. Mounting the pre-18 path (/var/lib/postgresql/data) creates an
      # empty volume while the real data stays in the container layer and is lost on `down`.
      - paradedb-data:/var/lib/postgresql

  gotrue:
    image: supabase/auth:v2.196.0
    depends_on:
      paradedb:
        condition: service_healthy
    environment:
      GOTRUE_DB_DRIVER: postgres
      # search_path=auth: GoTrue's migrations qualify every table as auth.*,
      # but its runtime queries do not — confirmed by this spec's spike,
      # which 500'd on every request without this until it was added.
      DATABASE_URL: "postgres://genql:genql@paradedb:5432/genql?search_path=auth"
      GOTRUE_SITE_URL: ${GENQL_APP_ORIGIN:-http://localhost:3000}
      # Must exactly match Settings.gotrue_jwt_secret (genql/core/settings.py)
      # — GoTrue signs with this, GenQL's GoTrueJwtVerifier verifies with it.
      GOTRUE_JWT_SECRET: ${GENQL_GOTRUE_JWT_SECRET}
      GOTRUE_JWT_EXP: "900"
      PORT: "9999"
      API_EXTERNAL_URL: ${GENQL_GOTRUE_EXTERNAL_URL:-http://localhost:9999}
      GOTRUE_DISABLE_SIGNUP: "false"
      # No SMTP is configured (the spike's logs show "Noop mail client being
      # used") so GoTrue's default confirm-by-email flow has no way to ever
      # deliver a confirmation link — without this, /signup returns a user
      # with no session, and the frontend's login-after-signup flow silently
      # gets no tokens back. Revisit if/when real email delivery is added.
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GENQL_GOOGLE_OAUTH_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GENQL_GOOGLE_OAUTH_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GENQL_GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${GENQL_GOOGLE_OAUTH_REDIRECT_URI:-}
      GOTRUE_EXTERNAL_GITHUB_ENABLED: ${GENQL_GITHUB_OAUTH_ENABLED:-false}
      GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: ${GENQL_GITHUB_OAUTH_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GITHUB_SECRET: ${GENQL_GITHUB_OAUTH_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: ${GENQL_GITHUB_OAUTH_REDIRECT_URI:-}
    ports: ["9999:9999"]

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/genqlgenql
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    ports: ["7474:7474", "7687:7687"]
    volumes:
      - neo4j-data:/data

  phoenix:
    # Arize Phoenix, self-hosted: the trace UI for "how many model calls did
    # that turn make, and what did they cost". Chosen over LangSmith because
    # prompts stay on this box — see genql/infrastructure/tracing/tracer.py.
    image: arizephoenix/phoenix:latest
    depends_on:
      paradedb:
        condition: service_healthy
    environment:
      # Its own store is the ParadeDB container everything else uses, in its
      # own schema, so traces survive a container replacement and no second
      # database has to be operated. Note the plain postgresql:// scheme —
      # Phoenix is not SQLAlchemy-with-psycopg like GenQL's own DSNs.
      PHOENIX_SQL_DATABASE_URL: postgresql://genql:genql@paradedb:5432/genql
      PHOENIX_SQL_DATABASE_SCHEMA: phoenix
      PHOENIX_WORKING_DIR: /mnt/data
    # 6006 is the UI and the OTLP/HTTP collector; 4317 is OTLP/gRPC, which
    # nothing here uses but which is what other collectors default to.
    ports: ["6006:6006", "4317:4317"]
    volumes:
      - phoenix-data:/mnt/data

volumes:
  paradedb-data:
  neo4j-data:
  phoenix-data:
